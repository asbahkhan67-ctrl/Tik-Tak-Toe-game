<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Welcome to the Rock Paper Scissor Game!!</header>
    <div class="container">
        <div class="choices">
        <img class="choice" id="rock" src="/images/rock.png" alt="rock">
        <img class="choice" id="paper" src="/images/paper.png" alt="paper">
        <img class="choice" id="scissor" src="/images/scissors.png" alt="scissor">
        </div>
    </div>


    <div class="scoreboard">
        <div class="score">
            <p id="user">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp">0</p>
            <p>Comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your Move</p>
    </div>


    <script src="script.js"></script>
</body>
</html>
